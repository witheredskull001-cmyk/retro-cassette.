
name: Build Retro Cassette APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Extract Retro Cassette source
        shell: bash
        run: |
          test -f retro-cassette-source.zip.part00 || { echo "Missing ZIP part 00"; exit 1; }
          test -f retro-cassette-source.zip.part01 || { echo "Missing ZIP part 01"; exit 1; }

          cat retro-cassette-source.zip.part00 retro-cassette-source.zip.part01 > retro-cassette-source.zip
          unzip -q retro-cassette-source.zip -d source

          test -f source/Retro-Cassette/gradlew

          sed -i 's/rootProject.name = "Retro Cassette"/rootProject.name = "Retro-Cassette"/' source/Retro-Cassette/settings.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore required core source dependency
        working-directory: source/Retro-Cassette
        shell: bash
        run: |
          if [ ! -f core/common/build.gradle.kts ]; then
            rm -rf core upstream-meta

            git init upstream-meta
            git -C upstream-meta remote add origin https://github.com/maxrave-dev/SimpMusic.git
            git -C upstream-meta fetch --depth=1 origin f78a4fd6da9680e5771f4763194d2895d26914fd

            CORE_SHA=$(git -C upstream-meta ls-tree FETCH_HEAD core | awk '{print $3}')
            test -n "$CORE_SHA"

            git init core
            git -C core remote add origin https://github.com/maxrave-dev/core.git
            git -C core fetch --depth=1 origin "$CORE_SHA"
            git -C core checkout --detach FETCH_HEAD
          fi

          test -f core/common/build.gradle.kts

      - name: Configure optional integration credentials
        working-directory: source/Retro-Cassette
        shell: bash
        run: |
          cat > local.properties <<'PROPERTIES'
          SENTRY_DSN=
          SENTRY_AUTH_TOKEN=
          LASTFM_API_KEY=
          LASTFM_SECRET=
          DISCORD_CLIENT_ID=
          PROPERTIES

      - name: Build debug APK
        working-directory: source/Retro-Cassette
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon exportLibraryDefinitions
          ./gradlew --no-daemon :androidApp:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: retro-cassette-debug-apk
          path: source/Retro-Cassette/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
